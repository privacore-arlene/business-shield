# Netlify deployment for PrivaCore Business Fraud Check.
# Production domain: https://check.privacoregroup.com
#
# Build target is hard-pinned to the Nitro `netlify` preset via vite.config.ts
# (nitro: { preset: "netlify" }). That preset emits server functions to
# `.netlify/functions-internal` and static assets to `dist/`, so the publish
# directory is `dist` (NOT dist/client — that is the Cloudflare layout).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"